version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wwil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wwil_admin
      POSTGRES_PASSWORD: wwil_secure_password_2026
      POSTGRES_DB: wwil_db
    ports:
      - "5432:5432"
    volumes:
      - wwil_pgdata:/var/lib/postgresql/data
      # Automatically initialize schema and seed data on first container start:
      - ./Backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Backend/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwil_admin -d wwil_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wwil_pgdata:
    driver: local
